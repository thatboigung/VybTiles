<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vyb Taps</title>
</head>

<body
  style="background-color: #0f172a; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; font-family: sans-serif;">
  <div id="root">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;">
      <h1 style="font-size: 2rem; font-weight: 900; letter-spacing: -0.05em; margin-bottom: 1rem; font-style: italic;">
        VYB TAPS</h1>
      <p style="font-size: 0.75rem; font-weight: 700; letter-spacing: 0.2em; opacity: 0.5;">INITIALIZING...</p>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((registration) => {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          }, (err) => {
            console.log('ServiceWorker registration failed: ', err);
          });
      });
    }
  </script>
</body>

</html>
